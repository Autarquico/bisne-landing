###############################################################################
# Landing estática -> GitHub Pages (bisne.es).
# En un PR solo se construye (claves de textos y presupuesto de 60 KB de build.py);
# en main se construye y se publica.
# Variables del repositorio (Settings > Variables, no secretos; ambas son públicas):
#   BISNE_TURNSTILE_SITEKEY  clave pública del widget de Turnstile (obligatoria en CI)
###############################################################################

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build site (60 KB budget)
        env:
          BISNE_API: https://app.bisne.es/api/publico
          BISNE_TURNSTILE_SITEKEY: ${{ vars.BISNE_TURNSTILE_SITEKEY }}
        run: python3 build.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
